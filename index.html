            }
            computeTerritories(); // 실제 상태로 복구
            return allInTerritory;
        }

        // ── 그룹에서 빈 점/사석/같은 색을 통해 도달하는 '빈 주머니' + 경계 정보 ──
        function floodEmptyRegion(group, color) {
            const groupSet = new Set(group.map(p => `${p.x},${p.y}`));
            const regionEmpty = new Set();
            const visited = new Set(groupSet);
            const stack = [...group];
            let touchesOpponent = false;
            let touchesOtherFriendly = false;

            while (stack.length) {
                const p = stack.pop();
                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (visited.has(nk)) continue;
                    const stone = board[n.y][n.x];
                    if (stone === null || deadStones.has(nk)) {
                        visited.add(nk);
                        regionEmpty.add(nk);
                        stack.push(n);
                    } else if (stone === color) {
                        touchesOtherFriendly = true; // 별도 아군 그룹과 공간 공유
                    } else {
                        touchesOpponent = true;      // 상대 벽
                    }
                }
            }
            return { groupSet, regionEmpty, touchesOpponent, touchesOtherFriendly };
        }

        // ── 눈공간과 같은 색 돌을 함께 타고 뭉치 전체를 수집 ──
        // (옥집으로 이어진 꼬리 돌까지 한 생명 단위로 묶어서 눈을 센다)
        function floodCluster(group, color) {
            const clusterStones = new Set(group.map(p => `${p.x},${p.y}`));
            const regionEmpty = new Set();
            const visited = new Set(clusterStones);
            const stack = [...group];
            let touchesOpponent = false;

            while (stack.length) {
                const p = stack.pop();
                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (visited.has(nk)) continue;
                    const stone = board[n.y][n.x];
                    if (stone === null || deadStones.has(nk)) {
                        visited.add(nk); regionEmpty.add(nk); stack.push(n);
                    } else if (stone === color) {
                        visited.add(nk); clusterStones.add(nk); stack.push(n); // 같은 색 → 뭉치에 포함
                    } else {
                        touchesOpponent = true;
                    }
                }
            }
            return { clusterStones, regionEmpty, touchesOpponent };
        }

        // ── 3단계: 눈공간으로 이어진 백 뭉치 전체의 진짜 눈 개수 → 두 눈 불가면 사석 ──
        // 반환 true = 사석. 불확실하면 false(생존)로 처리하여 오판 최소화.
        function isDeadByEyeSpace(group, color) {
            const { clusterStones, regionEmpty, touchesOpponent } = floodCluster(group, color);

            if (!touchesOpponent) return false;      // 상대에 안 닿음 → 살아있음
            if (regionEmpty.size > 25) return false; // 열린 대공간(전체 판) → 여기선 판단 안 함

            const { eyes, livingSpaces } = analyzeEyes(regionEmpty, clusterStones, color);
            if (livingSpaces >= 1) return false; // 두 눈 낼 수 있는 큰 공간 → 생존
            if (eyes >= 2) return false;         // 진짜 눈 2개 이상 → 생존
            if (winsSemeai(clusterStones, color)) return false; // 수상전에서 이기거나 비김 → 생존
            return true;                         // 그 외(옥집/한 눈/급소형) → 사석
        }

        // ── 수상전(활로 싸움) 안전장치 ──
        // 나를 둘러싼 상대 그룹이 2눈이 없고 활로가 내 이하이면 내가 이기거나 비김 → 나는 안 죽음
        function clusterLiberties(stonesSet) {
            const libs = new Set();
            for (const sk of stonesSet) {
                const [x, y] = sk.split(',').map(Number);
                for (const n of getNeighbors(x, y)) {
                    const nk = `${n.x},${n.y}`;
                    if (!stonesSet.has(nk) && (board[n.y][n.x] === null || deadStones.has(nk))) libs.add(nk);
                }
            }
            return libs.size;
        }

        function enemyClustersAround(stonesSet, color) {
            const opponent = color === 'black' ? 'white' : 'black';
            const seen = new Set();
            const groups = [];
            for (const sk of stonesSet) {
                const [x, y] = sk.split(',').map(Number);
                for (const n of getNeighbors(x, y)) {
                    const nk = `${n.x},${n.y}`;
                    if (board[n.y][n.x] === opponent && !deadStones.has(nk) && !seen.has(nk)) {
                        const g = getLiveGroup(n.x, n.y, opponent);
                        g.forEach(p => seen.add(`${p.x},${p.y}`));
                        if (g.length) groups.push(g);
                    }
                }
            }
            return groups;
        }

        function winsSemeai(stonesSet, color) {
            const myLibs = clusterLiberties(stonesSet);
            const opponent = color === 'black' ? 'white' : 'black';
            for (const eg of enemyClustersAround(stonesSet, color)) {
                const { clusterStones: eCluster, regionEmpty: eRegion } = floodCluster(eg, opponent);
                const { eyes, livingSpaces } = analyzeEyes(eRegion, eCluster, opponent);
                if (livingSpaces >= 1 || eyes >= 2) continue;  // 이 상대는 2눈 생존 → 못 이김
                if (clusterLiberties(eCluster) <= myLibs) return true; // 2눈 없는 상대가 내 활로 이하 → 내가 이김/비김
            }
            return false;
        }

        // ── 눈공간을 진짜 눈/큰 살아있는 공간으로 분류 (옥집 제외) ──
        function analyzeEyes(regionEmpty, groupSet, color) {
            const eyeRegions = findPureEyeRegions(regionEmpty, groupSet, color);
            let eyes = 0;         // 확정 눈 개수 (옥집 제외)
            let livingSpaces = 0; // 급소형이 아닌 큰 눈공간 (그 자체로 두 눈 가능)
            for (const region of eyeRegions) {
                if (region.length === 1) {
                    const [ex, ey] = region[0].split(',').map(Number);
                    if (isRealSinglePointEye(ex, ey, color)) eyes++; // 옥집이면 세지 않음
                } else if (isNakadeShape(region)) {
                    eyes++;         // 작은/급소형 공간 = 눈 1개로 환원
                } else {
                    livingSpaces++; // 큰 공간 = 두 눈 가능
                }
            }
            return { eyes, livingSpaces };
        }

        // ── 단일 빈 점이 진짜 눈인지(옥집 아님) 대각선으로 판별 ──
        // 변/귀: 대각선에 상대 돌 0개, 중앙: 대각선 상대 돌 1개 이하 → 진짜 눈
        function isRealSinglePointEye(x, y, color) {
            let edgeDiag = 0, enemyDiag = 0;
            for (const d of getDiagonals(x, y)) {
                if (d.x < 0 || d.x >= boardSize || d.y < 0 || d.y >= boardSize) {
                    edgeDiag++;
                } else {
                    const s = board[d.y][d.x];
                    if (s && s !== color && !deadStones.has(`${d.x},${d.y}`)) enemyDiag++;
                }
            }
            return (edgeDiag > 0) ? (enemyDiag === 0) : (enemyDiag <= 1);
        }

        // ── 4단계: 아군 지원 없이 포위되고 활로가 적어 탈출 불가 → 사석 ──
        // (열린 판으로 활로가 나 있어도, 단수 상태로 도망 못 가면 잡힌 돌)
        function isDeadBySurround(group, color) {
            const { groupSet, regionEmpty, touchesOpponent, touchesOtherFriendly } = floodEmptyRegion(group, color);

            if (!touchesOpponent) return false;      // 상대에 안 닿음 → 생존
            if (touchesOtherFriendly) return false;  // 도달 가능한 아군 지원 있음 → 보수적 생존

            const libs = getLiberties(group);
            if (libs.length > 2) return false;       // 활로 3개 이상 → 명백한 잡힘 아님(보수적)

            const { eyes, livingSpaces } = analyzeEyes(regionEmpty, groupSet, color);
            if (eyes >= 2 || livingSpaces >= 1) return false; // 두 눈/큰 공간 → 생존

            // 되따냄(스냅백) 방지: 인접 상대 그룹이 단수면 잡아먹을 수 있으니 제외
            const opponent = color === 'black' ? 'white' : 'black';
            for (const eg of findAdjacentGroups(group, opponent)) {
                if (getLiberties(eg).length <= 1) return false;
            }

            // 탈출 확인: 한 번 뻗었을 때 최대 활로가 3 이하면 도망 못 감 → 사석
            let best = 0;
            for (const lib of libs) {
                best = Math.max(best, extendLiberties(groupSet, color, lib));
            }
            if (best > 3) return false;
            if (winsSemeai(groupSet, color)) return false; // 수상전에서 이기거나 비김 → 생존
            return true;
        }

        // 그룹이 libKey에 한 수 뻗었을 때(아군 연결 포함) 확보하는 활로 수
        function extendLiberties(groupSet, color, libKey) {
            const stones = new Set(groupSet);
            stones.add(libKey);
            const [lx, ly] = libKey.split(',').map(Number);
            for (const n of getNeighbors(lx, ly)) {
                const nk = `${n.x},${n.y}`;
                if (board[n.y][n.x] === color && !stones.has(nk)) {
                    for (const p of getLiveGroup(n.x, n.y, color)) stones.add(`${p.x},${p.y}`);
                }
            }
            const libs = new Set();
            for (const sk of stones) {
                const [sx, sy] = sk.split(',').map(Number);
                for (const n of getNeighbors(sx, sy)) {
                    const nk = `${n.x},${n.y}`;
                    if (!stones.has(nk) && (board[n.y][n.x] === null || deadStones.has(nk))) libs.add(nk);
                }
            }
            return libs.size;
        }

        // regionEmpty 중 이웃 돌이 전부 이 그룹인 빈 연결영역만 추출 (순수 눈 후보)
        function findPureEyeRegions(regionEmpty, groupSet, color) {
            const eyes = [];
            const seen = new Set();
            for (const startKey of regionEmpty) {
                if (seen.has(startKey)) continue;
                const comp = [];
                const st = [startKey];
                seen.add(startKey);
                let pure = true;
                while (st.length) {
                    const ck = st.pop();
                    comp.push(ck);
                    const [cx, cy] = ck.split(',').map(Number);
                    for (const n of getNeighbors(cx, cy)) {
                        const nk = `${n.x},${n.y}`;
                        const stone = board[n.y][n.x];
                        if (stone === null || deadStones.has(nk)) {
                            if (regionEmpty.has(nk) && !seen.has(nk)) { seen.add(nk); st.push(nk); }
                        } else if (stone === color) {
                            if (!groupSet.has(nk)) pure = false; // 다른 아군 그룹 접촉
                        } else {
                            pure = false;                        // 상대 돌 접촉 → 순수 눈 아님(공배)
                        }
                    }
                }
                if (pure) eyes.push(comp);
            }
            return eyes;
        }

        // ── 자동 사석 판정 버튼: 탐지 + 표시 (계가 모드면 집·점수까지) ──
        function autoDetectDead() {
            if (!countMode) return;
            detectDeadStones();

            if (scoreMode) calculateTerritories(); // 계가 모드에서만 집·점수
            renderBoard();                         // 사석 X 표시

            const msg = deadStones.size === 0
                ? '사석 없음 — 죽은 돌은 클릭으로 직접 지정'
                : `사석 ${deadStones.size}개 감지 — 오판된 돌은 클릭으로 수정`;
            showMessage(msg);
        }

        // 사석 제외한 연결 그룹
        function getLiveGroup(x, y, color) {
            const group = [], visited = new Set();
            const stack = [{x, y}];
            while (stack.length) {
                const p = stack.pop();
                const pk = `${p.x},${p.y}`;
                if (visited.has(pk)) continue;
                visited.add(pk);
                if (board[p.y][p.x] !== color || deadStones.has(pk)) continue;
                group.push(p);
                for (const n of getNeighbors(p.x, p.y)) {
                    if (!visited.has(`${n.x},${n.y}`)) stack.push(n);
                }
            }
            return group;
        }

        // 그룹에서 빈 공간(사석 포함)에 도달 가능한지 BFS
        function canReachEmpty(group, color) {
            const visited = new Set(group.map(p => `${p.x},${p.y}`));
            const stack = [...group];
            while (stack.length) {
                const p = stack.pop();
                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (visited.has(nk)) continue;
                    visited.add(nk);
                    const stone = board[n.y][n.x];
                    if (stone === null)       return true;   // 빈 점 → 탈출 가능
                    if (deadStones.has(nk))  return true;   // 사석 자리 = 실질적 빈 점
                    if (stone === color)      stack.push(n); // 같은 색 → 계속 탐색
                    // 상대 살아있는 돌 → 막힘
                }
            }
            return false;
        }

        function isGroupDeadAdvanced(group, color, unconditionallyAliveSet) {
            const opponent = color === 'black' ? 'white' : 'black';

            // 0. 무조건 살아있는 그룹과 연결되어 있으면 살아있음
            for (const p of group) {
                for (const n of getNeighbors(p.x, p.y)) {
                    if (board[n.y][n.x] === color && unconditionallyAliveSet.has(`${n.x},${n.y}`)) {
                        return false; // 살아있는 그룹과 연결됨
                    }
                }
            }

            // 1. 활로 확인
            const liberties = getLiberties(group);
            // 활로가 매우 많고(10+) 그룹도 크면 살아있을 가능성 높음 (성능 최적화용)
            if (liberties.length > 10 && group.length > 6) return false;

            // 2. 그룹 주변 분석
            const surroundingInfo = analyzeSurroundingAdvanced(group, color);

            // 완전히 둘러싸여 있지 않으면 판단 보류
            if (!surroundingInfo.isFullySurrounded) return false;

            // 3. 내부 공간 분석
            const internalRegion = getInternalRegion(group, color);

            // 4. Nakade 형태 확인
            if (isNakadeShape(internalRegion.emptyPoints)) {
                // 내부가 nakade 형태면 한 눈만 가능 → 죽음
                if (internalRegion.emptyPoints.length > 0) {
                    return true;
                }
            }

            // 5. 두 눈 형성 가능성 확인
            const potentialEyes = findPotentialEyes(group, color);
            if (potentialEyes.length >= 2) {
                // 독립된 두 눈이 될 수 있는 공간이 있으면 살아있음
                return false;
            }

            // 6. 눈 개수 확인
            const eyeCount = countEyesAdvanced(group, color);
            if (eyeCount >= 2) return false;

            // 7. 수상전 분석 (인접한 적 그룹과 비교)
            const adjacentEnemyGroups = findAdjacentGroups(group, opponent);
            for (const enemyGroup of adjacentEnemyGroups) {
                const semeai = analyzeSemeai(group, enemyGroup);
                // 이기거나 불확실(수상전 진행 중)이면 살아있는 것으로 처리
                if (semeai.group1Wins || semeai.isUndetermined) return false;
            }

            // 8. 내부 공간 + 활로 조합으로 판단 (보수적 기준)
            // 인접한 적 그룹이 있으면 수상전 가능 → 섣불리 죽음 판정 안 함
            if (adjacentEnemyGroups.length > 0) return false;

            // 9. 완전히 포위되고 한 눈도 없고 활로가 극히 적으면 죽음
            if (eyeCount === 0 && liberties.length <= 2 && surroundingInfo.isFullySurrounded) {
                return true;
            }

            // 10. 한 눈이고 내부 공간이 매우 좁고 포위된 경우만 죽음
            if (eyeCount === 1 && internalRegion.emptyPoints.length <= 1
                && surroundingInfo.isFullySurrounded && liberties.length <= 2) {
                return true;
            }

            // 불확실한 경우는 살아있는 것으로 처리 (보수적 판정)
            return false;
        }

        function analyzeSurroundingAdvanced(group, color) {
            const opponent = color === 'black' ? 'white' : 'black';
            const groupSet = new Set(group.map(p => `${p.x},${p.y}`));

            let opponentStones = 0;
            let edgePoints = 0;
            let emptyPoints = 0;
            const checkedEmpty = new Set();
            const borderPoints = [];

            for (const p of group) {
                // 가장자리 체크
                if (p.x === 0 || p.x === boardSize - 1 || p.y === 0 || p.y === boardSize - 1) {
                    edgePoints++;
                }

                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (groupSet.has(nk)) continue;

                    if (board[n.y][n.x] === opponent) {
                        opponentStones++;
                        borderPoints.push(n);
                    } else if (board[n.y][n.x] === null && !checkedEmpty.has(nk)) {
                        checkedEmpty.add(nk);
                        emptyPoints++;
                    }
                }
            }

            // 빈 점들이 모두 상대에게 둘러싸여 있는지 확인
            let allEmptyEnclosed = true;
            for (const emptyKey of checkedEmpty) {
                const [ex, ey] = emptyKey.split(',').map(Number);
                if (!isPointEnclosed(ex, ey, opponent, groupSet, color)) {
                    allEmptyEnclosed = false;
                    break;
                }
            }

            const isFullySurrounded = allEmptyEnclosed &&
                ((opponentStones > 0) || (edgePoints > 0 && opponentStones > 0));

            return { isFullySurrounded, opponentStones, edgePoints, emptyPoints };
        }

        function isPointEnclosed(x, y, enclosingColor, ignoreGroup, ignoreColor) {
            // BFS로 빈 점이 특정 색에 의해 둘러싸여 있는지 확인
            const visited = new Set();
            const stack = [{x, y}];

            while (stack.length > 0) {
                const p = stack.pop();
                const key = `${p.x},${p.y}`;
                if (visited.has(key)) continue;

                if (board[p.y][p.x] !== null) {
                    if (board[p.y][p.x] === ignoreColor && ignoreGroup.has(key)) {
                        continue; // 무시할 그룹
                    }
                    if (board[p.y][p.x] !== enclosingColor && board[p.y][p.x] !== ignoreColor) {
                        return false; // 다른 색 발견
                    }
                    continue;
                }

                visited.add(key);

                for (const n of getNeighbors(p.x, p.y)) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        stack.push(n);
                    }
                }
            }

            return true;
        }

        function getInternalRegion(group, color) {
            const groupSet = new Set(group.map(p => `${p.x},${p.y}`));
            const emptyPoints = [];
            const visited = new Set();

            for (const p of group) {
                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (visited.has(nk) || groupSet.has(nk)) continue;

                    if (board[n.y][n.x] === null) {
                        // 연결된 빈 영역 탐색
                        const region = exploreEmptyRegion(n.x, n.y, groupSet, color);
                        region.forEach(pk => visited.add(pk));
                        emptyPoints.push(...region);
                    }
                }
            }

            return { emptyPoints };
        }

        function exploreEmptyRegion(startX, startY, boundaryGroup, boundaryColor) {
            const visited = new Set();
            const points = [];
            const stack = [{x: startX, y: startY}];

            while (stack.length > 0) {
                const p = stack.pop();
                const key = `${p.x},${p.y}`;
                if (visited.has(key)) continue;

                if (board[p.y][p.x] !== null) {
                    continue; // 돌이 있으면 멈춤
                }

                // 경계 그룹에만 접해야 함
                let touchesBoundary = false;
                let touchesOther = false;
                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (board[n.y][n.x] === boundaryColor) {
                        if (boundaryGroup.has(nk)) touchesBoundary = true;
                        else touchesOther = true;
                    }
                }

                if (touchesOther) continue; // 다른 같은 색 그룹에 접하면 외부

                visited.add(key);
                points.push(key);

                for (const n of getNeighbors(p.x, p.y)) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        stack.push(n);
                    }
                }
            }

            return points;
        }

        function findPotentialEyes(group, color) {
            // 두 눈이 될 수 있는 독립된 빈 영역 찾기
            const groupSet = new Set(group.map(p => `${p.x},${p.y}`));
            const eyeRegions = [];
            const visited = new Set();

            for (const p of group) {
                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (visited.has(nk) || board[n.y][n.x] !== null) continue;

                    // 연결된 빈 영역 탐색
                    const region = [];
                    const stack = [{x: n.x, y: n.y}];
                    let isEyeCandidate = true;

                    while (stack.length > 0) {
                        const ep = stack.pop();
                        const epk = `${ep.x},${ep.y}`;
                        if (visited.has(epk)) continue;

                        if (board[ep.y][ep.x] !== null) {
                            if (board[ep.y][ep.x] !== color || !groupSet.has(epk)) {
                                if (board[ep.y][ep.x] !== color) {
                                    isEyeCandidate = false; // 적 돌에 접함
                                }
                            }
                            continue;
                        }

                        visited.add(epk);
                        region.push(epk);

                        for (const nn of getNeighbors(ep.x, ep.y)) {
                            if (!visited.has(`${nn.x},${nn.y}`)) {
                                stack.push(nn);
                            }
                        }
                    }

                    // 눈 크기 제한 완화 (크기 6 이하 → 실전에서 6점 이하 빈 공간은 눈이 될 수 있음)
                    if (isEyeCandidate && region.length > 0 && region.length <= 6) {
                        eyeRegions.push(region);
                    }
                }
            }

            return eyeRegions;
        }

        function countEyesAdvanced(group, color) {
            // 개선된 눈 카운팅 - 진짜 눈만 센다
            const groupSet = new Set(group.map(p => `${p.x},${p.y}`));
            const realEyes = [];
            const checked = new Set();

            for (const p of group) {
                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (checked.has(nk) || board[n.y][n.x] !== null) continue;
                    checked.add(nk);

                    // 이 빈 점이 진짜 눈인지 확인
                    let allNeighborsAreFriendly = true;
                    let allNeighborsInGroup = true;

                    for (const nn of getNeighbors(n.x, n.y)) {
                        if (board[nn.y][nn.x] === null) {
                            allNeighborsAreFriendly = false; // 빈 점에 연결됨
                        } else if (board[nn.y][nn.x] !== color) {
                            allNeighborsAreFriendly = false; // 적돌에 접함
                        } else if (!groupSet.has(`${nn.x},${nn.y}`)) {
                            allNeighborsInGroup = false; // 다른 그룹
                        }
                    }

                    if (!allNeighborsAreFriendly || !allNeighborsInGroup) continue;

                    // 대각선 체크 (거짓 눈 판별)
                    const diagonals = getDiagonals(n.x, n.y);
                    let enemyDiagonals = 0;
                    let edgeDiagonals = 0;

                    for (const d of diagonals) {
                        if (d.x < 0 || d.x >= boardSize || d.y < 0 || d.y >= boardSize) {
                            edgeDiagonals++;
                        } else if (board[d.y][d.x] !== null && board[d.y][d.x] !== color) {
                            enemyDiagonals++;
                        }
                    }

                    // 가장자리: 대각 적 0개, 중앙: 대각 적 1개 이하
                    const isRealEye = (edgeDiagonals > 0) ? (enemyDiagonals === 0) : (enemyDiagonals <= 1);

                    if (isRealEye) {
                        realEyes.push(nk);
                    }
                }
            }

            return realEyes.length;
        }

        function findAdjacentGroups(group, targetColor) {
            const groupSet = new Set(group.map(p => `${p.x},${p.y}`));
            const foundGroups = [];
            const checkedStones = new Set();

            for (const p of group) {
                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (checkedStones.has(nk)) continue;

                    if (board[n.y][n.x] === targetColor) {
                        const adjacentGroup = getGroup(n.x, n.y);
                        adjacentGroup.forEach(ap => checkedStones.add(`${ap.x},${ap.y}`));
                        foundGroups.push(adjacentGroup);
                    }
                }
            }

            return foundGroups;
        }

        // ═══════════════════════════════════════════════════════════════════
        // 기존 호환용 함수 (레거시)
        // ═══════════════════════════════════════════════════════════════════

        function isGroupDead(group, color) {
            // 하위 호환성을 위해 유지, 내부적으로 개선된 함수 호출
            const unconditionallyAlive = findUnconditionallyAlive(color);
            return isGroupDeadAdvanced(group, color, unconditionallyAlive);
        }

        function analyzeSurrounding(group, color) {
            const opponent = color === 'black' ? 'white' : 'black';
            const groupSet = new Set(group.map(p => `${p.x},${p.y}`));
            let opponentCount = 0;
            let edgeCount = 0;
            let emptyCount = 0;
            const checked = new Set();

            for (const p of group) {
                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (groupSet.has(nk) || checked.has(nk)) continue;
                    checked.add(nk);

                    if (board[n.y][n.x] === opponent) {
                        opponentCount++;
                    } else if (board[n.y][n.x] === null) {
                        emptyCount++;
                    }
                }

                // 가장자리 체크
                if (p.x === 0 || p.x === boardSize - 1 || p.y === 0 || p.y === boardSize - 1) {
                    edgeCount++;
                }
            }

            // 빈 점이 상대에게 둘러싸여 있는지 확인
            let emptyEnclosed = true;
            for (const p of group) {
                for (const n of getNeighbors(p.x, p.y)) {
                    if (board[n.y][n.x] === null) {
                        // 이 빈 점이 외부와 연결되어 있는지 확인
                        if (!isEnclosed(n.x, n.y, color, groupSet)) {
                            emptyEnclosed = false;
                            break;
                        }
                    }
                }
                if (!emptyEnclosed) break;
            }

            const isFullySurrounded = emptyEnclosed && (opponentCount > 0 || edgeCount > 0);

            return { isFullySurrounded, opponentCount, edgeCount, emptyCount };
        }

        function isEnclosed(x, y, friendlyColor, friendlyGroup) {
            // BFS로 빈 점이 상대 또는 가장자리에 의해 둘러싸여 있는지 확인
            const opponent = friendlyColor === 'black' ? 'white' : 'black';
            const visited = new Set();
            const stack = [{x, y}];
            let touchesOutside = false;

            while (stack.length > 0) {
                const p = stack.pop();
                const key = `${p.x},${p.y}`;
                if (visited.has(key)) continue;
                visited.add(key);

                if (board[p.y][p.x] === friendlyColor && !friendlyGroup.has(key)) {
                    // 다른 아군 그룹과 연결됨
                    touchesOutside = true;
                    break;
                }

                if (board[p.y][p.x] === null || friendlyGroup.has(key)) {
                    for (const n of getNeighbors(p.x, p.y)) {
                        if (!visited.has(`${n.x},${n.y}`)) {
                            stack.push(n);
                        }
                    }
                }
            }

            return !touchesOutside;
        }

        function countEyes(group, color) {
            const groupSet = new Set(group.map(p => `${p.x},${p.y}`));
            const eyeCandidates = new Set();

            // 그룹 내부의 빈 점 찾기
            for (const p of group) {
                for (const n of getNeighbors(p.x, p.y)) {
                    if (board[n.y][n.x] === null) {
                        // 이 빈 점이 눈인지 확인 (모든 인접점이 같은 그룹인지)
                        let isEye = true;
                        let allNeighborsInGroup = true;

                        for (const nn of getNeighbors(n.x, n.y)) {
                            const nnk = `${nn.x},${nn.y}`;
                            if (board[nn.y][nn.x] === null) {
                                // 빈 점과 연결된 빈 점이 있으면 단일 눈이 아님
                                isEye = false;
                            } else if (board[nn.y][nn.x] === color && !groupSet.has(nnk)) {
                                // 다른 그룹과 연결
                                allNeighborsInGroup = false;
                            } else if (board[nn.y][nn.x] !== color) {
                                isEye = false;
                            }
                        }

                        if (isEye && allNeighborsInGroup) {
                            // 대각선 체크 (진짜 눈인지 확인)
                            const diagonals = getDiagonals(n.x, n.y);
                            let enemyDiagonals = 0;
                            let edgeDiagonals = 0;

                            for (const d of diagonals) {
                                if (d.x < 0 || d.x >= boardSize || d.y < 0 || d.y >= boardSize) {
                                    edgeDiagonals++;
                                } else if (board[d.y][d.x] !== color && board[d.y][d.x] !== null) {
                                    enemyDiagonals++;
                                }
                            }

                            // 가장자리에서는 대각선 1개, 그 외에는 2개 이상이면 거짓 눈
                            const isRealEye = (edgeDiagonals > 0) ? (enemyDiagonals === 0) : (enemyDiagonals <= 1);

                            if (isRealEye) {
                                eyeCandidates.add(`${n.x},${n.y}`);
                            }
                        }
                    }
                }
            }

            return eyeCandidates.size;
        }

        function getDiagonals(x, y) {
            return [
                {x: x-1, y: y-1}, {x: x+1, y: y-1},
                {x: x-1, y: y+1}, {x: x+1, y: y+1}
            ];
        }

        function getInternalSpaces(group, color) {
            const groupSet = new Set(group.map(p => `${p.x},${p.y}`));
            const spaces = [];
            const checked = new Set();

            for (const p of group) {
                for (const n of getNeighbors(p.x, p.y)) {
                    const nk = `${n.x},${n.y}`;
                    if (checked.has(nk)) continue;
                    checked.add(nk);

                    if (board[n.y][n.x] === null) {
                        spaces.push(n);
                    }
                }
            }

            return spaces;
        }

        function updateCountResult() {
            const blackTerritory = territories.black.length;
            const whiteTerritory = territories.white.length;

            // 사석 카운트 (사석으로 판정된 돌)
            let blackDead = 0, whiteDead = 0;
            for (const key of deadStones) {
                const [x, y] = key.split(',').map(Number);
                if (board[y][x] === 'black') blackDead++;
                else if (board[y][x] === 'white') whiteDead++;
            }

            // 일본룰 계산
            // 흑 합계 = 흑 집 + 흑이 잡은 돌(capturedBlack) + 백의 사석(whiteDead)
            // 백 합계 = 백 집 + 백이 잡은 돌(capturedWhite) + 흑의 사석(blackDead) + 덤
            const blackTotal = blackTerritory + capturedBlack + whiteDead;
            const whiteTotal = whiteTerritory + capturedWhite + blackDead + KOMI;

            document.getElementById('black-territory').textContent  = blackTerritory;
            document.getElementById('white-territory').textContent  = whiteTerritory;

            document.getElementById('black-total').textContent      = blackTotal.toFixed(1);
            document.getElementById('white-total').textContent      = whiteTotal.toFixed(1);

            const diff = Math.abs(blackTotal - whiteTotal);
            const winner = blackTotal > whiteTotal ? '흑' : '백';
            document.getElementById('final-result').textContent = `${winner} ${diff.toFixed(1)}집 승`;
            document.getElementById('final-result').style.color =
                blackTotal > whiteTotal ? '#3498db' : '#e0e0e0';

            document.getElementById('count-result').style.display = 'block';
        }

        /* ─── 기보 저장 ─── */
        function buildSGF() {
            var now = new Date();
            var d = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
            var s = '(;GM[1]FF[4]CA[UTF-8]SZ[' + boardSize + ']KM[' + KOMI + ']DT[' + d + ']\n';
            moveList.forEach(function(m, i) {
                var c = m.player === 'black' ? 'B' : 'W';
                var coord = m.type === 'pass' ? '' : String.fromCharCode(97 + m.x) + String.fromCharCode(97 + m.y);
                s += ';' + c + '[' + coord + ']';
                if ((i + 1) % 8 === 0) s += '\n';
            });
            return s + ')';
        }

        function saveKiboSGF() {
            if (moveList.length === 0) { showMessage('저장할 기보가 없습니다'); return; }
            var now = new Date();
            var ts = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0')
                   + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
            var blob = new Blob([buildSGF()], {type: 'application/x-go-sgf'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = 'baduk_' + boardSize + 'x' + boardSize + '_' + ts + '.sgf';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showMessage('기보 저장 완료 (' + moveList.length + '수)');
        }

        /* ─── 기보 가져오기 ─── */
        function triggerFileLoad() {

        function loadSGFFile(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            var fname = file.name;
            reader.onload = function(ev) { parseSGF(ev.target.result, fname); };
            reader.readAsText(file, 'UTF-8');
            e.target.value = '';
        }

        function parseSGF(text, filename) {
            var szM = text.match(/SZ\[(\d+)\]/);
            var size = szM ? parseInt(szM[1]) : 19;
            var dtM = text.match(/DT\[([^\]]+)\]/);

            // AB/AW: 초기 배치돌 파싱 (착수 위치)
            var setupStones = [];
            var setupRe = /(AB|AW)((?:\[[a-zA-Z]{2}\])+)/g;
            var sm;
            while ((sm = setupRe.exec(text)) !== null) {
                var sPlayer = sm[1] === 'AB' ? 'black' : 'white';
                var pts = sm[2].match(/\[([a-zA-Z]{2})\]/g) || [];
                pts.forEach(function(p) {
                    var c = p.slice(1, -1).toLowerCase();
                    var sx = c.charCodeAt(0) - 97;
                    var sy = c.charCodeAt(1) - 97;
                    if (sx >= 0 && sx < size && sy >= 0 && sy < size) {
                        setupStones.push({ player: sPlayer, x: sx, y: sy });
                    }
                });
            }

            // ;B[..] ;W[..]: 정해 수순 파싱
            var moves = [];
            var re = /;([BW])\[([a-zA-Z]{0,2})\]/g;
            var m;
            while ((m = re.exec(text)) !== null) {
                var player = m[1] === 'B' ? 'black' : 'white';
                var coord  = m[2].toLowerCase();
                if (coord === '' || coord === 'tt') {
                    moves.push({ player: player, type: 'pass' });
                } else if (coord.length === 2) {
                    var x = coord.charCodeAt(0) - 97;
                    var y = coord.charCodeAt(1) - 97;
                    if (x >= 0 && x < size && y >= 0 && y < size) {
                        moves.push({ player: player, type: 'stone', x: x, y: y });
                    }
                }
            }
            if (moves.length === 0 && setupStones.length === 0) { showMessage('착수 정보를 찾을 수 없습니다'); return; }

            // PL: 둘 차례 (없으면 정해 첫 수 색, 그것도 없으면 흑)
            var plM = text.match(/PL\[([BW])\]/);
            var turn = plM ? (plM[1] === 'W' ? 'white' : 'black')
                           : (moves.length ? moves[0].player : 'black');

            enterReviewMode(size, moves, filename, dtM ? dtM[1] : '', setupStones, turn);
        }

        function enterReviewMode(size, moves, filename, date, setupStones, turn) {
            // 현재 대국 저장

                moveList: moveList.slice(), cellSize: cellSize
            };
            var hasSetup = setupStones && setupStones.length > 0;
            reviewMode    = true;
            reviewMoves   = moves;
            reviewStep    = 0;
            junghaeLocked = hasSetup; // AB/AW 있을 때만 정해 잠금

            boardSize = size;
            board = Array(size).fill(null).map(function(){ return Array(size).fill(null); });
            capturedBlack = 0; capturedWhite = 0; lastMove = null; koPoint = null;

            // AB/AW 초기 배치돌 적용 (번호 없이 표시됨 — reviewMoves에 포함 안 됨)
            if (hasSetup) {
                setupStones.forEach(function(s) {
                    board[s.y][s.x] = s.player;
                });
            }
            // 착수 위치 스냅샷 (정해 탐색 시 기준점)
            reviewSetupBoard = board.map(function(r){ return r.slice(); });
            // 사활 문제(AB/AW 배치)면 문제 영역만 크롭해서 크게 표시
            cropView = hasSetup ? computeCropRegion() : null;
            cellSize = computeCellSize();
            problemTurn = turn || 'black';
            currentPlayer = problemTurn; // 문제 풀이: 둘 차례부터 직접 착수 가능
            moveList = []; history = []; passCount = 0; koPoint = null;

            document.querySelectorAll('.size-selector button').forEach(function(b){ b.classList.remove('active'); });
            var sb = document.getElementById('btn-' + size);
            if (sb) sb.classList.add('active');

            document.getElementById('review-bar').style.display   = 'flex';

            var info;

                document.getElementById('rv-step').textContent   = '문제 — ' + turnLabel + ' 차례 (정해 ' + moves.length + '수)';
                document.getElementById('rv-detail').textContent = '직접 두어 풀어보세요 · 정해 보기로 답 확인';
                renderBoard();
                updateUI();
                info = '';
            } else {
                // AB/AW 없음(수순 전체 = 착수): 전체 수순을 바로 표시
                document.getElementById('rv-nav').style.display       = 'flex';
                document.getElementById('rv-nav-right').style.display = 'flex';
                document.getElementById('btn-junghae').style.display  = 'none';

                reviewGoTo(moves.length);
                info = '📖 ' + (filename || '기보') + ' — 총 ' + moves.length + '수 | ← → 키 또는 버튼으로 이동';
            }
            if (date) info += ' (' + date + ')';
            showMessage(info);
        }

        function exitReviewMode() {
            if (!reviewMode) return;
            reviewMode = false;

            // moveList: 현재 검토 위치(reviewStep)까지의 수순 유지
            // → 새 착수는 이 번호에 이어서 부여됨
            moveList = [];
            for (var i = 0; i < reviewStep; i++) {
                var rm = reviewMoves[i];
                moveList.push({
                    player:  rm.player,
                    type:    rm.type,
                    x:       rm.x,
                    y:       rm.y,
                    moveNum: i + 1,
                    coord:   rm.type === 'stone'
                                 ? COORDS[rm.x] + (boardSize - rm.y)
                                 : '패스'
                });
            }

            // 다음 차례 플레이어 결정
            if (reviewStep > 0) {
                currentPlayer = reviewMoves[reviewStep - 1].player === 'black' ? 'white' : 'black';
            } else {
                currentPlayer = 'black';
            }

            // 마지막 착수 좌표 (마지막 수가 stone인 경우)
            lastMove = null;
            if (reviewStep > 0 && reviewMoves[reviewStep - 1].type === 'stone') {
                lastMove = { x: reviewMoves[reviewStep - 1].x, y: reviewMoves[reviewStep - 1].y };
            }

            // 무르기 기록 초기화 (불러온 기보 이전으로는 무르기 불가)
            history = [];
            passCount = 0;
            koPoint   = null;
            countMode = false;
            scoreMode = false;
            deadStones = new Set();
            territories = { black: [], white: [] };

            reviewMoves = []; reviewStep = 0; savedState = null;
            reviewSetupBoard = null; junghaeLocked = true;

            renderBoard(); updateUI();

        }

        function showJunghae() {
            // ── 오답 검토중 → 오답 직전 정해 위치로 회귀 + 추천수(ⓗ) 표시 + 자동전환 (계속 풀이) ──
            if(freeAfterWrong && reviewMode && reviewMoves.length && reviewSetupBoard){
                var resume = junghaeMatchLen();
                if(curProblem>=0 && typeof PROBLEMS!=='undefined'){
                    var _pnh = PROBLEMS[curProblem].n;
                    progress[_pnh]=progress[_pnh]||{tries:0,solved:false,solves:0,hints:0};
                    progress[_pnh].hints=(progress[_pnh].hints||0)+1; saveProgress(); refreshRow(curProblem);
                }
                // 보드를 정해 선상(resume)으로 복원 — 오답 이후 둔 수는 버림
                board = reviewSetupBoard.map(function(r){ return r.slice(); });
                capturedBlack=0; capturedWhite=0; lastMove=null; koPoint=null; passCount=0; history=[]; moveList=[];
                for(var _i=0;_i<resume;_i++){ var _m=reviewMoves[_i]; if(_m.type==='stone'){ applyReviewMove(_m.x,_m.y,_m.player); moveList.push({player:_m.player,type:'stone',x:_m.x,y:_m.y,moveNum:_i+1,coord:COORDS[_m.x]+(boardSize-_m.y)}); lastMove={x:_m.x,y:_m.y}; } }
                currentPlayer = (resume===0)? problemTurn : (reviewMoves[resume-1].player==='black'?'white':'black');
                answerMode='auto'; try{localStorage.setItem('hh_mode','auto');}catch(e){} updateModeButtons();   // 자동전환
                hintMove = (resume<reviewMoves.length) ? { x:reviewMoves[resume].x, y:reviewMoves[resume].y } : null;   // 추천수
                freeAfterWrong=false; aiRespondMode=false; solveDone=false; triedThisAttempt=true;
                // junghaeLocked=true 유지 → 추천수 두면 checkSolve가 자동 응수 진행
                renderBoard(); updateUI(); updateSolveStatus();
                showMessage('추천수 ⓗ 위치에 직접 두세요 — 이후 자동으로 진행됩니다');
                return;
            }
            // ── 일반 정해 보기 → 수순 재생(◀▶) ──
            // v3.10: 정해 보기 시 수동 모드면 자동으로 전환 (정해 수순 재생/응수가 자동에서 자연스러움)
            if(answerMode==='manual'){ answerMode='auto'; try{localStorage.setItem('hh_mode','auto');}catch(e){} updateModeButtons(); }
            junghaeLocked = false;
            if (curProblem >= 0 && typeof PROBLEMS !== 'undefined') {

                progress[_pn].hints = (progress[_pn].hints||0) + 1;
                saveProgress(); refreshRow(curProblem);
            }
            // 사용자가 두던 시도 기록 정리 (정해는 배치 스냅샷에서 재생)
            history = []; moveList = []; passCount = 0; koPoint = null;

            document.getElementById('btn-back').style.display = 'none';
            document.getElementById('rv-nav').style.display       = 'flex';
            document.getElementById('rv-nav-right').style.display = 'flex';
            // 오답 검토중 상태 해제 → 정해 진행 중으로
            freeAfterWrong = false; aiRespondMode = false; solveDone = false;
            reviewGoTo(Math.min(1, reviewMoves.length));

        function resetToProblem() {

        function reviewGoTo(step) {
            if (!reviewMode) return;
            // 정해 완료(마지막 수)에서 ▶로 더 가려 하면 아무것도 안 함 (다음수 안 두어짐)
            if (step > reviewMoves.length && reviewStep >= reviewMoves.length) return;
            step = Math.max(0, Math.min(step, reviewMoves.length));
            // 착수 위치(스냅샷)에서 시작
            if (reviewSetupBoard) {
                board = reviewSetupBoard.map(function(r){ return r.slice(); });
            } else {
                board = Array(boardSize).fill(null).map(function(){ return Array(boardSize).fill(null); });
            }
            capturedBlack = 0; capturedWhite = 0; lastMove = null;
            for (var i = 0; i < step; i++) {
                var m = reviewMoves[i];
                if (m.type === 'stone') {
                    applyReviewMove(m.x, m.y, m.player);
                    lastMove = { x: m.x, y: m.y };
                }
            }
            reviewStep = step;
            // 정해 재생 중 차례 갱신: 다음 둘 사람
            currentPlayer = (step === 0) ? problemTurn : (reviewMoves[step-1].player === 'black' ? 'white' : 'black');
            renderBoard();
            updateUI();
            updateReviewInfo();
        }

        function applyReviewMove(x, y, player) {
            board[y][x] = player;
            var opponent = player === 'black' ? 'white' : 'black';
            getNeighbors(x, y).forEach(function(n) {
                if (board[n.y][n.x] === opponent) {
                    var g = getGroup(n.x, n.y);
                    if (getLiberties(g).length === 0) {
                        g.forEach(function(p) { board[p.y][p.x] = null; });
                        if (player === 'black') capturedBlack += g.length;
                        else capturedWhite += g.length;
                    }
                }
            });
        }

        function updateReviewInfo() {
            var atEnd = (reviewMoves.length > 0 && reviewStep === reviewMoves.length);
            document.getElementById('rv-step').textContent = reviewStep + ' / ' + reviewMoves.length + '수' + (atEnd ? ' · 🏁 완료' : '');
            if (reviewStep === 0) {
                var hasBoardSetup = reviewSetupBoard && reviewSetupBoard.some(function(row){ return row.some(function(c){ return c !== null; }); });
                document.getElementById('rv-detail').textContent = hasBoardSetup ? '착수 위치 (정해 이전)' : '기보 시작 (빈 바둑판)';
            } else {
                var m = reviewMoves[reviewStep - 1];
                var color = m.player === 'black' ? '흑●' : '백○';
                var base;
                if (m.type === 'pass') {
                    base = reviewStep + '수: ' + color + ' 패스';
                } else {
                    var coord = COORDS[m.x] + (boardSize - m.y);
                    base = reviewStep + '수: ' + color + ' ' + coord;
                }
                document.getElementById('rv-detail').textContent = atEnd ? (base + ' — 🏁 정해 완료 (마지막 수)') : base;
            }
            if (atEnd) showSuccess('🏁 정해 완료', '마지막 수입니다', 1200);   // 팝업 박스로 잠깐 떴다 사라짐
        }

        // 키보드 이동
        document.addEventListener('keydown', function(e) {
            // 정해 보기 중: 좌우로 수순 이동
            if (reviewMode && !junghaeLocked && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                e.preventDefault(); reviewGoTo(reviewStep + (e.key === 'ArrowRight' ? 1 : -1)); return;
            }

            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); prevProblem(); }
            else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); nextProblem(); }
        });

        var REF = (function(){ try{ return JSON.parse(localStorage.getItem('hh_refflags')||'{}'); }catch(e){ return {}; } })();

        function xy2(s){ return { x:s.charCodeAt(0)-97, y:s.charCodeAt(1)-97 }; }
        function loadProblem(i){
            if(i<0||i>=PROBLEMS.length) return;
            // v2.4: 미니 갤러리가 떠 있으면 닫고 보드로 진입
            var _mg=document.getElementById('mini-gallery');
            if(_mg && _mg.style.display!=='none'){ _mg.style.display='none'; var _bk=document.getElementById('mg-back'); if(_bk) _bk.style.display=''; }
            curProblem=i; triedThisAttempt=false; autoResponding=false; solveDone=false; aiRespondMode=false; _pendingAI=false; aiCandidates=[]; freeAfterWrong=false; hintMove=null; var p=PROBLEMS[i];
            var setup=[];
            p.ab.forEach(function(c){ var q=xy2(c); setup.push({player:'black',x:q.x,y:q.y}); });
            p.aw.forEach(function(c){ var q=xy2(c); setup.push({player:'white',x:q.x,y:q.y}); });
            var moves=p.sol.map(function(m){ var q=xy2(m.slice(1)); return {player:m[0]==='b'?'black':'white',type:'stone',x:q.x,y:q.y}; });
            // 상변/하변(가로로 넓은) 문제는 세로 화면에 맞게 90° 회전 → 좌변/우변(세로형)으로.
            // 사활은 회전해도 동일한 문제이므로 정답 그대로. (가로 화면=데스크톱은 회전 안 함)
            (function(){
                if(window.innerHeight < window.innerWidth) return;      // 가로 화면이면 원본 유지
                var minx=99,miny=99,maxx=-1,maxy=-1;
                function acc(x,y){ if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; }
                setup.forEach(function(s){ acc(s.x,s.y); });
                moves.forEach(function(m){ acc(m.x,m.y); });
                if(maxx<0) return;
                if((maxx-minx) <= (maxy-miny)) return;                  // 이미 세로형이면 그대로
                function rot(p){ return { x: 18 - p.y, y: p.x }; }      // 90° 시계방향
                setup = setup.map(function(s){ var r=rot(s); return {player:s.player, x:r.x, y:r.y}; });
                moves = moves.map(function(m){ var r=rot(m); return {player:m.player, type:m.type, x:r.x, y:r.y}; });
            })();
            // 둘 차례는 정해 첫 수의 색에서 유도(t 필드가 어긋난 기보 방어 — #9/#12/#400/HH#316 등 자동응수 복구)
            var turn = moves.length ? moves[0].player : (p.t==='w'?'white':'black');
            enterReviewMode(19, moves, '현현기경 '+p.n, '', setup, turn);
            document.getElementById('prob-title').textContent='제 '+p.n+' 문제';
            // 커스텀 저장 정해 불러오기
            if (moves.length === 0) {
                var custKey = 'hh_custom_sol_'+collection;

            }
            document.getElementById('prob-goal').textContent = p.desc || ((turn==='white'?'백 선':'흑 선')+(moves.length?(' · 정해 '+moves.length+'수'):' · (정해 없음)'));
            fillProbBox(p, turn, moves.length);   // 좌측 박스: 제목/차례 바둑알/정해 수/사활

            document.getElementById('btn-save-sol').style.display = moves.length ? 'none' : '';

        }

        /* ── 폴더 통계 ── */
        function getFolderStats(id) {

            var read=0, solved=0, last='';

        function selectFolderByInfo(info) {
            selectedFolderCol = { id:info.id, name:info.name, display:info.display, count:info.count, builtin:info.builtin };
            collection = 'folder_'+info.id;

        var pendingFolderInfo = null;
        var folderCache = null;   // { 폴더명: [File,...] } — 상위 폴더 1회 선택으로 전체 캐시
        function loadFolderFiles(e) {
            var all = Array.prototype.slice.call(e.target.files || []);
            var sgfs = all.filter(function(f){ return f.name.toLowerCase().endsWith('.sgf'); });
            if (!sgfs.length) { showMessage('SGF 파일을 찾지 못했습니다 — 폴더를 다시 확인하세요'); return; }

                var parts = (f.webkitRelativePath || f.name).split('/');
                var folder = parts.length >= 2 ? parts[parts.length-2] : '';

                folderCache[folder].push(f);
            });

        async function loadFromCache(info) { return loadFromCacheKey(info.name, info); }
        async function loadFromCacheKey(key, info) {
            var sgfs = (folderCache && folderCache[key]) ? folderCache[key].slice() : [];
            if (!sgfs.length) { showMessage('"'+key+'" 폴더에 SGF가 없습니다'); return; }

                var p = parseSGFToProblem(texts[i], sgfs[i].name);
                if (p && (p.ab.length>0 || p.aw.length>0)) probs.push(p);
            }
            probs.sort(function(a,b){ return a.n-b.n; });

        /* ══════════════ 미니 문제 갤러리 (v2.4) ══════════════ */
        // 기경중묘 장(章) 구분 — 문제 번호 → 장 이름
        var GJ_CHAPTERS = [
            [1,103,'사는 수'], [104,174,'잡는 수'], [175,264,'패쓰는 수'],
            [265,360,'수상전'], [361,400,'모는 수'], [401,474,'넘는 수'], [475,520,'기타 기술']
        ];
        function chapterLabel(p) {
            // 기경중묘(id 20)면 번호로 장 구분
            var isGJ = selectedFolderCol && (selectedFolderCol.id==='20' || (selectedFolderCol.display||'').indexOf('기경중묘')>=0);
            if (isGJ) {
                for (var c=0;c<GJ_CHAPTERS.length;c++){ if(p.n>=GJ_CHAPTERS[c][0] && p.n<=GJ_CHAPTERS[c][1]) return GJ_CHAPTERS[c][2]; }
            }
            // 그 외 컬렉션: desc의 유형/결과어를 짧게
            var parts=(p.desc||'').split('·').map(function(s){return s.trim();}).filter(Boolean);
            for (var i=0;i<parts.length;i++){
                var w=parts[i].replace(/^(흑선|백선|흑 선|백 선)\s*/,'').replace('삶','활');
                if (/^(활|사|죽음|잡음|잡기|패|빅|연결|절단|득|살기|잡기)$/.test(w)) return w;
            }
            return '';
        }
        // 미니 바둑판 SVG — 돌들의 경계상자(+여백)만 크롭해서 그림
        function miniBoardSVG(p) {
            var stones=[];
            (p.ab||[]).forEach(function(c){ stones.push({x:c.charCodeAt(0)-97,y:c.charCodeAt(1)-97,b:true}); });
            (p.aw||[]).forEach(function(c){ stones.push({x:c.charCodeAt(0)-97,y:c.charCodeAt(1)-97,b:false}); });
            if(!stones.length) return '<svg class="mg-board" viewBox="0 0 10 10"></svg>';
            var minX=19,maxX=0,minY=19,maxY=0;
            stones.forEach(function(s){ if(s.x<minX)minX=s.x; if(s.x>maxX)maxX=s.x; if(s.y<minY)minY=s.y; if(s.y>maxY)maxY=s.y; });
            var m=1;                          // 여백 1선
            var x0=Math.max(0,minX-m), x1=Math.min(18,maxX+m);
            var y0=Math.max(0,minY-m), y1=Math.min(18,maxY+m);
            var cols=x1-x0+1, rows=y1-y0+1;
            var cell=12, pad=cell/2;
            var W=cols*cell, H=rows*cell;
            var svg='<svg class="mg-board" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
            svg+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#e8c47a"/>';
            // 격자선 (반칸 여백 안쪽). 판 가장자리에 닿으면 굵게.
            for(var gx=x0; gx<=x1; gx++){
                var px=pad+(gx-x0)*cell;
                var edge=(gx===0||gx===18)?1.6:0.7;
                svg+='<line x1="'+px+'" y1="'+pad+'" x2="'+px+'" y2="'+(H-pad)+'" stroke="#5a3d1a" stroke-width="'+edge+'"/>';
            }
            for(var gy=y0; gy<=y1; gy++){
                var py=pad+(gy-y0)*cell;
                var edgeY=(gy===0||gy===18)?1.6:0.7;
                svg+='<line x1="'+pad+'" y1="'+py+'" x2="'+(W-pad)+'" y2="'+py+'" stroke="#5a3d1a" stroke-width="'+edgeY+'"/>';
            }
            // 돌
            var r=cell*0.46;
            stones.forEach(function(s){
                var cx=pad+(s.x-x0)*cell, cy=pad+(s.y-y0)*cell;
                svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(s.b?'#111':'#fafafa')+'" stroke="'+(s.b?'#000':'#888')+'" stroke-width="0.6"/>';
            });
            svg+='</svg>';
            return svg;
        }

            // 스크롤 감지: 기보보기와 동일하게 스크롤 중 탭 차단
            var _scrolled=false, _touchY=0;
            grid.addEventListener('touchstart', function(e){ _touchY=e.touches[0].clientY; _scrolled=false; }, {passive:true});

            if(_mgObserver){ _mgObserver.disconnect(); }
            _mgObserver=new IntersectionObserver(function(entries){
                entries.forEach(function(en){
                    if(!en.isIntersecting) return;

            // 번호(n)순 정렬해 표시 — 클릭은 원본 인덱스로 진입 (장 구분이 순서대로 묶임)
            var order=PROBLEMS.map(function(_,idx){return idx;}).sort(function(a,b){return (PROBLEMS[a].n||0)-(PROBLEMS[b].n||0);});

                cell.innerHTML='<div class="mg-num">'+p.n+'번</div>'
                    +'<div class="mg-board-slot"></div>'
                    +'<div class="mg-info">'
                    +'<div class="mg-chapter">'+(ch||'&nbsp;')+' '+nosol+'</div>'
                    +'<div class="mg-status">'+solved+'</div>'
                    +'</div>';
                // 기보보기와 동일: 스크롤 중이면 무시, 탭하면 바로 열기
                (function(i){ cell.onclick = function(){ if(_scrolled) return; enterFromGallery(i); }; })(idx);
                frag.appendChild(cell);
                _mgObserver.observe(cell);
            });
            grid.appendChild(frag);
            g.style.display='flex';
            document.body.classList.add('gallery-open');   // 햄버거 숨김
            document.getElementById('mg-back').style.display='none';

        }

        async function _loadSGFAsync(info) {
            if (!window.showDirectoryPicker) { showMessage('폴더 접근 미지원 — Chrome/Edge 권장'); return; }

                try { baseDirHandle = await window.showDirectoryPicker({mode:'read'}); }

        // setup 노드는 유지하고 정해 착수만 새로 써넣은 SGF 텍스트 생성
        function patchSGFText(text, sol) {
            var aw=(text.match(/AW(?:\[[a-z]{2}\])+/)||[''])[0];
            var ab=(text.match(/AB(?:\[[a-z]{2}\])+/)||[''])[0];
            var pl=(text.match(/PL\[[BW]\]/)||[''])[0];
            var c =(text.match(/C\[[^\]]*\]/)||[''])[0];
            var mv=sol.map(function(m){ return ';'+(m[0]==='b'?'B':'W')+'['+m.slice(1)+']'; }).join('');
            return '(;GM[1]FF[3]SZ[19]\n'+aw+ab+pl+c+'\n'+mv+'\n)';
        }
        // 저장한 정해(localStorage)를 현재 문제집 SGF 폴더에 직접 써넣어 영구 반영 (v2.6)
        async function reflectSolutions() {
            if (!selectedFolderCol) { showMessage('먼저 좌측에서 문제집(폴더)을 선택하세요'); return; }
            var custKey = 'hh_custom_sol_'+collection;
            var cust = {}; try { cust=JSON.parse(localStorage.getItem(custKey)||'{}'); } catch(e){}
            var nums = Object.keys(cust).filter(function(k){ return Array.isArray(cust[k]) && cust[k].length; });
            if (!nums.length) { showMessage('반영할 저장된 정해가 없습니다 — 먼저 문제에서 💾 정해 저장 하세요'); return; }
            if (!window.showDirectoryPicker) { showMessage('이 브라우저는 폴더 직접쓰기 미지원 → JSON으로 내보냅니다'); exportCustomSolutions(); return; }
            // 쓰기 권한 폴더 핸들 확보
            try {
                if (!baseDirHandle) { baseDirHandle = await window.showDirectoryPicker({mode:'readwrite'}); }
                var perm = await baseDirHandle.queryPermission({mode:'readwrite'});
                if (perm!=='granted') perm = await baseDirHandle.requestPermission({mode:'readwrite'});
                if (perm!=='granted') { showMessage('폴더 쓰기 권한이 필요합니다 (상위 기보 폴더를 읽기+쓰기로 허용)'); return; }
            } catch(e){ if(e.name!=='AbortError') showMessage('폴더 접근 오류: '+e.message); return; }
            // 하위(문제집) 폴더 핸들
            var subDir;
            try { subDir = await baseDirHandle.getDirectoryHandle(selectedFolderCol.name,{create:false}); }
            catch(e){ showMessage('하위 폴더 없음: "'+selectedFolderCol.name+'" — 상위 기보 루트 폴더를 선택했는지 확인'); return; }
            // 폴더 내 파일 번호 → 핸들 매핑
            var byNum = {};
            try { for await (var ent of subDir.values()) {
                if (ent.kind!=='file' || !/\.sgf$/i.test(ent.name)) continue;
                var mm = ent.name.match(/(\d+)/); if(!mm) continue;
                byNum[parseInt(mm[1])] = ent;
            } } catch(e){ showMessage('폴더 읽기 오류: '+e.message); return; }
            var done=0, miss=0;
            for (var i=0;i<nums.length;i++){
                var n=parseInt(nums[i]); var fh=byNum[n];
                if(!fh){ miss++; continue; }
                try {
                    var file=await fh.getFile(); var text=await file.text();
                    var patched=patchSGFText(text, cust[nums[i]]);
                    var w=await fh.createWritable(); await w.write(patched); await w.close();
                    done++;
                } catch(e){ miss++; }
            }
            showMessage('📥 폴더 반영 완료 — '+done+'개 SGF에 정해 저장'+(miss?(' · 실패/누락 '+miss):'')+'  ["'+selectedFolderCol.name+'"]');
        }

        // 저장된 정해(localStorage) 전체를 JSON 파일로 내보내기 (백업/대체 수단)
        function exportCustomSolutions() {
            var out = {}, total = 0;
            for (var i=0;i<localStorage.length;i++){
                var k = localStorage.key(i);
                if (k && k.indexOf('hh_custom_sol_')===0){
                    var coll = k.slice('hh_custom_sol_'.length);
                    try {
                        var obj = JSON.parse(localStorage.getItem(k)||'{}');
                        var cnt = Object.keys(obj).length;
                        if (cnt>0){ out[coll]=obj; total+=cnt; }
                    } catch(e){}
                }
            }
            if (total===0){ showMessage('내보낼 저장된 정해가 없습니다 — 먼저 문제에서 💾 정해 저장 하세요'); return; }
            var json = JSON.stringify(out, null, 2);
            var blob = new Blob([json], {type:'application/json'});
            var url = URL.createObjectURL(blob);
            var d = new Date();
            var p2=function(x){return ('0'+x).slice(-2);};
            var stamp = d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes());
            var a = document.createElement('a');
            a.href = url; a.download = '정해_export_'+stamp+'.json';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
            var colls = Object.keys(out).map(function(c){ return c+'('+Object.keys(out[c]).length+')'; }).join(', ');
            showMessage('📤 정해 내보내기 완료 — 총 '+total+'개 ['+colls+'] · 다운로드 폴더 확인');
        }

        function parseSGFToProblem(text, fname) {
            var numM = fname.match(/(\d+)/);
            var n = numM ? parseInt(numM[1]) : 0;
            var ab = [], aw = [];
            var abRe = /AB((?:\[[a-zA-Z]{2}\])+)/g, am;
            while ((am = abRe.exec(text)) !== null) {
                (am[1].match(/\[([a-zA-Z]{2})\]/g)||[]).forEach(function(p){ ab.push(p.slice(1,-1).toLowerCase()); });
            }
            var awRe = /AW((?:\[[a-zA-Z]{2}\])+)/g;
            while ((am = awRe.exec(text)) !== null) {
                (am[1].match(/\[([a-zA-Z]{2})\]/g)||[]).forEach(function(p){ aw.push(p.slice(1,-1).toLowerCase()); });
            }
            var sol = [], re = /;([BW])\[([a-zA-Z]{0,2})\]/g, m;
            while ((m = re.exec(text)) !== null) {
                var coord = m[2].toLowerCase();
                if (coord && coord !== 'tt' && coord.length === 2) sol.push((m[1]==='B'?'b':'w')+coord);
            }

            var descM = text.match(/C\[([^\]]*)\]/) || text.match(/GN\[([^\]]*)\]/);

            return { n:n, t:t, ab:ab, aw:aw, sol:sol, desc:desc };

        /* ═══════════ AI 국소 응수 (v3.1) ═══════════
           오답 시: 전체판 승부는 무시하고, 문제 돌들을 작은 판으로 '크롭'해
           KataGo(server.js 3200)에 보내 '해당 돌들의 생사'에만 집중한 최선 응수를
           받아 착점한다. 이후 사용자가 두는 매 수에 계속 대응한다. */
        // ── 안드로이드(PWA) 버전: KataGo 로컬 서버 연동 제거 ──
        // 폰에는 로컬 KataGo 서버(3200)가 없으므로 네트워크 연결을 전부 비활성화한다.
        // 문제풀이는 내장 정해(SOL)로 완전히 오프라인 동작하며, '오답 응징' 부가기능만 빠진다.
        var _aiSock = null, AI_SERVER = null;
        var _pendingAI = false, _lastCrop = null, aiRespondMode = false, aiCandidates = [];

        function ensureAISocket(cb){ cb(false); }   // (모바일) 서버 연결 없음
        // 판 위 모든 돌의 바운딩박스 + 여백을 잘라 작은 판으로 (전체판 무시 → 국소 사활만)
        function computeCrop(margin){
            margin = margin || 2;
            var minx=99,maxx=-1,miny=99,maxy=-1;
            for(var y=0;y<boardSize;y++) for(var x=0;x<boardSize;x++){
                if(board[y][x]){ if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; }
            }
            if(maxx<0) return null;
            minx=Math.max(0,minx-margin); maxx=Math.min(boardSize-1,maxx+margin);
            miny=Math.max(0,miny-margin); maxy=Math.min(boardSize-1,maxy+margin);
            return { minx:minx, miny:miny, w:maxx-minx+1, h:maxy-miny+1 };
        }
        function cropGTP(x,y,c){ return COORDS[x-c.minx] + (c.h - (y-c.miny)); }         // 전체(x,y)→크롭 GTP
        function cropToFull(g,c){                                                          // 크롭 GTP→전체(x,y)
            var col=COORDS.indexOf(g[0].toUpperCase()), rn=parseInt(g.slice(1),10);
            if(col<0||isNaN(rn)) return null;
            return { x:col+c.minx, y:(c.h-rn)+c.miny };
        }
        function cropStones(c){
            var s=[];
            for(var y=0;y<boardSize;y++) for(var x=0;x<boardSize;x++){
                if(board[y][x]) s.push([ board[y][x]==='black'?'B':'W', cropGTP(x,y,c) ]);
            }
            return s;
        }
        // AI(상대=현재 차례) 국소 응수 — (모바일) KataGo 서버가 없으므로 비활성.
        function requestLocalAI(){ return; }
        // KataGo 응답 → 상위 후보 A/B/C 를 전체판 좌표로 환산해 마커·평가 표시(자동착수 X, 비교용)
        function onLocalAIMove(obj){
            if(!_pendingAI) return; _pendingAI=false;
            var infos=(obj&&obj.moveInfos)||[];
            if(!infos.length){ showMessage('상대 응수 후보가 없습니다'); return; }
            infos=infos.slice().sort(function(a,b){ return (b.visits||0)-(a.visits||0); });
            var labels=['A','B','C']; aiCandidates=[]; var parts=[];
            for(var i=0;i<infos.length && aiCandidates.length<3;i++){
                var m=infos[i]; if(!m.move || m.move==='pass') continue;
                var xy=cropToFull(m.move,_lastCrop); if(!xy) continue;
                var L=labels[aiCandidates.length];
                var coord=COORDS[xy.x]+(boardSize-xy.y);
                aiCandidates.push({ x:xy.x, y:xy.y, label:L });
                parts.push(L+':'+coord+'(승'+Math.round((m.winrate||0)*100)+' 집'+(typeof m.scoreLead==='number'?((m.scoreLead>=0?'+':'')+m.scoreLead.toFixed(1)):'?')+' v'+(m.visits||0)+')');
            }
            renderBoard();   // 마커 그리기 (renderBoard 끝에서 aiCandidates 오버레이)
            if(!aiCandidates.length){ showMessage('상대가 응수할 곳이 없습니다 (사활 결정됨)'); return; }
            showMessage('응수 후보 — '+parts.join('   ')+'  · 어느 게 맞는지 알려주세요 (자동착수 안 함)');
        }
        // "틀렸습니다" 표시 (무르지 않음 — 이후 AI 응수로 이어짐)

        }

        // 현재 착수열(moveList)이 정해(reviewMoves)의 앞부분과 정확히 일치하는가 = 정해 라인 위
        function onJunghaeLine(){
            for(var i=0;i<moveList.length;i++){
                var lm=moveList[i], em=reviewMoves[i];
                if(!em || !lm || lm.player!==em.player || lm.x!==em.x || lm.y!==em.y) return false;
            }
            return true;
        }
        // 정해와 일치하는 앞부분 길이(오답 직전까지의 정해 진행 수)
        function junghaeMatchLen(){
            var k=0;
            for(var i=0;i<moveList.length;i++){
                var lm=moveList[i], em=reviewMoves[i];
                if(!em || !lm || lm.player!==em.player || lm.x!==em.x || lm.y!==em.y) break;

        function checkSolve(){
            if(curProblem<0) return;
            // 정해 수순이 없는 문제는 오류체크 대상 아님 (자유 착점)
            if(reviewMoves.length===0) return;
            var p=PROBLEMS[curProblem];
            // 풀이 완료 후에는 오류체크 중단 (자유 착점)
            if(solveDone) return;
            if(freeAfterWrong) return;   // 오답 후 자유 진행 중 — 채점·응수 안 함 (뒤로/초기화로 복귀)
            // 시도 횟수: 이번 도전의 첫 수에서 1회
            if(!triedThisAttempt){ triedThisAttempt=true; progress[p.n]=progress[p.n]||{tries:0,solved:false,solves:0,hints:0}; progress[p.n].tries=(progress[p.n].tries||0)+1; saveProgress(); if(curProblem>=0) refreshRow(curProblem); }

            // ── 수동모드: 정해와 일치하면 진행, 벗어나면 오답 검토중 (무르지 않음) ──
            if(answerMode==='manual'){
                var idxM = moveList.length - 1, lastM = moveList[idxM], expM = reviewMoves[idxM];
                if(!expM || !lastM || lastM.player!==expM.player || lastM.x!==expM.x || lastM.y!==expM.y){
                    showWrongToast(); freeAfterWrong=true; updateSolveStatus(); return;   // 정해 이탈 → 오답 검토중
                }
                if(moveList.length>=reviewMoves.length){ markSolved(p); return; }          // 정해 완주 → 정답 완료
                var ncM = reviewMoves[moveList.length].player==='black'?'흑':'백';
                showMessage('✔ ('+moveList.length+'/'+reviewMoves.length+') — '+ncM+' 차례 (직접)');
                return;
            }

            // ── 자동모드: 기존 오류체크 + 자동응수 ──
            var idx = moveList.length - 1;      // 방금 둔 수 = 정해의 idx번째여야 함
            var last = moveList[idx], exp = reviewMoves[idx];
            if(!exp || last.player!==exp.player || last.x!==exp.x || last.y!==exp.y){
                // 오답 → 틀렸습니다 + 수동모드로 전환 + 오답검토중 (그 자리에 두고 계속 둬볼 수 있게)
                showWrongToast();
                answerMode='manual'; try{localStorage.setItem('hh_mode','manual');}catch(e){} updateModeButtons();
                freeAfterWrong = true;
                updateSolveStatus();
                return;
            }
            // 정답 한 수 — 완료면 성공
            if(moveList.length>=reviewMoves.length){ markSolved(p); return; }
            if(answerMode==='auto'){
                // 자동: 상대 응수 자동 착수 (연속 상대 수도 처리)
                autoResponding=true;
                while(moveList.length<reviewMoves.length && reviewMoves[moveList.length].player!==problemTurn){

                if(moveList.length>=reviewMoves.length){ markSolved(p); return; }

            }
        }

        boardSize = 19;

                            : rf==='ref'   ? '<span class="mst-ref">참조유</span>'
                            : '<span class="mst-none">–</span>';
                rows+='<tr class="mst-row'+(st.solved?' solved':'')+'" data-i="'+i+'">'
                    +'<td class="mst-no">'+p.n+(st.solved?' ✓':'')+'</td>'
                    +'<td>'+(st.tries||0)+'</td>'
                    +'<td class="'+(st.solves?'mst-ok':'')+'">'+(st.solves||0)+'</td>'
                    +'<td>'+(st.hints||0)+'</td>'
                    +'<td>'+(p.sol.length>0?p.sol.length:'—')+'</td>'
                    +'<td>'+refCell+'</td>'
                  +'</tr>';
            }
            host.innerHTML='<div class="msr-head">'+(selectedFolderCol?selectedFolderCol.display:'문제')
                +' <span>완료 '+mCountSolved()+' / '+PROBLEMS.length+'</span></div>'
                +'<table class="m-stat-table">'
                +'<thead><tr><th>번호</th><th>시도</th><th>정답</th><th>힌트</th><th>정해</th><th>분류</th></tr></thead>'
                +'<tbody>'+rows+'</tbody></table>';
            var trs=host.querySelectorAll('.mst-row');
            for(var k=0;k<trs.length;k++){ (function(tr){ tr.onclick=function(){ mSolve(+tr.dataset.i); }; })(trs[k]); }
            var sub=document.getElementById('m-prob-sub'); if(sub) sub.textContent='';
        }

        // 전체기보: 미니 갤러리(원래 모양). 탭 → 문제(풀기)
        function mGallery(info){
            if(info) selectFolderByInfo(info);
            mCloseNav();
            showGallery();
        }
        // 문제(풀기): 그대로
        function mSolve(i){ mCloseNav(); loadProblem(i); }

        // 햄버거(돌아가기):
        //  - 전체기보(갤러리) 화면에선 → 문제집
        //  - 풀이 화면에선 → 전체기보(갤러리)
        // (통계는 문제집 카드의 [통계] 버튼으로만 진입)
        function mHamburger(){
            if(!mIsMobile()) return;
            var gal = document.getElementById('mini-gallery');
            var galOpen = gal && gal.style.display !== 'none';
            if(galOpen){ mShowCollections(); return; }      // 갤러리 → 문제집
            if(selectedFolderCol){ mGallery(null); }        // 풀이 → 전체기보
            else { mShowCollections(); }
        }

        /* ── 이전/다음 문제 이동 (버튼 · 스와이프 공용) ── */
        var _swipeSuppressTap = 0;
        function gotoProblem(dir){
            if(typeof PROBLEMS === 'undefined' || !PROBLEMS.length) return;
            if(curProblem < 0){ loadProblem(0); return; }          // 미선택 시 첫 문제
            var ni = curProblem + dir;
            if(ni < 0){ showMessage('⛔ 첫 문제입니다'); return; }
            if(ni >= PROBLEMS.length){ showMessage('⛔ 마지막 문제입니다'); return; }
            loadProblem(ni);
        }
        // 바둑판 영역 스와이프 → 좌/우, 상/하 밀어서 다음·이전 문제
        (function(){
            var area = document.querySelector('.board-area');
            if(!area) return;
            var sx=0, sy=0, tracking=false;
            area.addEventListener('touchstart', function(e){
                if(e.touches.length !== 1){ tracking=false; return; }
                var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true;
            }, {passive:true});
            area.addEventListener('touchend', function(e){
                if(!tracking) return; tracking=false;
                var ch=e.changedTouches[0]; if(!ch) return;
                var dx=ch.clientX-sx, dy=ch.clientY-sy, ax=Math.abs(dx), ay=Math.abs(dy);
                if(Math.max(ax,ay) < 50) return;      // 짧은 이동은 탭(착수)으로 처리
                _swipeSuppressTap = Date.now();       // 뒤따르는 착수 click 억제
                if(ax >= ay){ gotoProblem(dx < 0 ? 1 : -1); }   // ← 다음 / → 이전
                else        { gotoProblem(dy < 0 ? 1 : -1); }   // ↑ 다음 / ↓ 이전
            }, {passive:true});
        })();
        // 드로어에서 '문제'를 고르면 자동으로 닫고 바둑판으로. (폴더 선택은 열어둠)
        document.addEventListener('click', function(e){
            if(!mIsMobile() || !document.body.classList.contains('drawer-open')) return;
            if(e.target.closest && e.target.closest('.pl-row')) toggleDrawer(false);
        }, true);
        // 화면 회전·크기 변경 시 바둑판 다시 맞춤
        window.addEventListener('orientationchange', function(){ setTimeout(fitBoard, 150); });
        window.addEventListener('resize', function(){ fitBoard(); });
        // 처음 진입 시 모바일이면: 레이아웃 재맞춤 + 문제집 화면부터 시작
        if(mIsMobile()) setTimeout(function(){ fitBoard(); mShowCollections(); }, 60);

        // 📱💻 뒤로가기 버튼 → 앱 닫지 말고 이전 화면으로 (폰·태블릿·PC 공통, 앱 유지)
        (function(){
            function appBack(){
                var gal=document.getElementById('mini-gallery');
                if(gal && gal.style.display!=='none'){                                   // 전체기보(갤러리) 열림
                    if(mIsMobile()) mShowCollections();                                  //   모바일: 문제집으로
                    else { gal.style.display='none'; document.body.classList.remove('gallery-open'); }  //   데스크톱: 갤러리 닫기
                    return;
                }
                if(mIsMobile()){
                    if(document.body.classList.contains('mnav-open')){
                        var sp=document.getElementById('m-scr-prob');
                        if(sp && !sp.hidden){ mShowCollections(); }                       // 통계 → 문제집
                        return;                                                           // 문제집(최상위)은 그대로
                    }
                    if(curProblem>=0){ mGallery(null); return; }                          // 바둑판 → 전체기보
                }
                // 그 외(데스크톱 등)에선 아무것도 안 함 → 앱 유지(안 닫힘)
            }
            try{
                history.pushState(null,'');
                window.addEventListener('popstate', function(){
                    appBack();
                    try{ history.pushState(null,''); }catch(e){}   // 재무장 → back으로 앱 안 닫힘
                });
            }catch(e){}
        })();

        // 서비스워커 등록 → 오프라인 실행 + 홈화면 설치
        if('serviceWorker' in navigator){
            window.addEventListener('load', function(){
                navigator.serviceWorker.register('sw.js').catch(function(){});
            });
        }
    </script>
</body>
</html>
